name: Verify and deploy Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Instalar Chromium para las comprobaciones en navegador (OPT-5, T9, QA-1, OPT-4)
        run: npx playwright install --with-deps chromium
      - run: npm run test:performance-lh
      - run: npm run test:mobile-overflow
      - run: npm run test:e2e
      - run: npm run test:a11y-axe
      - run: npm run test:perf-screens
      - run: npm run test:load-budget
      # P5 del cuestionario del rediseño (19/10/2026): cuando una prueba en navegador falla, guardar sus
      # trazas y capturas (test-results/, retain-on-failure en playwright.config.cjs) para ver la causa
      # sin repetir los ~30 minutos de CI. Solo en fallo; no cambia ningún umbral ni bloquea nada más.
      - name: Guardar trazas y capturas de Playwright si algo ha fallado
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-fallos-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
      - name: WebKit frente a Chromium, sin estrangular (WP-52 · NTC-04) — informativo, no bloquea
        continue-on-error: true
        run: |
          npx playwright install --with-deps webkit
          npm run measure:load-webkit
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@v5
