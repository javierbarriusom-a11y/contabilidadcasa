name: Published availability

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check HTTPS and critical resources
        env:
          SITE_URL: https://javierbarriusom-a11y.github.io/contabilidadcasa
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --max-time 30 "$SITE_URL/" --output "$RUNNER_TEMP/site-index.html"
          curl --fail --silent --show-error --location --retry 3 --max-time 30 "$SITE_URL/app.js" --output "$RUNNER_TEMP/site-app.js"
          curl --fail --silent --show-error --location --retry 3 --max-time 30 "$SITE_URL/data.js" --output "$RUNNER_TEMP/site-data.js"
          curl --fail --silent --show-error --location --retry 3 --max-time 30 "$SITE_URL/version.json" --output "$RUNNER_TEMP/site-version.json"
          grep -q '<main id="mainContent"' "$RUNNER_TEMP/site-index.html"
          grep -q '"publicDemo":true' "$RUNNER_TEMP/site-data.js"
          grep -q '"version"' "$RUNNER_TEMP/site-version.json"
